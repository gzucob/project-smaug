[project]
name = "smaug"
version = "0.1.0"
description = "Ingestão fiel e auditável dos dados fundamentais da carteira (CVM/B3)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "beanie>=1.29",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "typer>=0.15",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "mcp>=2,<3",
]

[project.scripts]
smaug = "smaug.entrypoints.cli:main"
smaug-mcp = "smaug.entrypoints.mcp:main"

[dependency-groups]
dev = [
    "import-linter>=2.14",
    "mypy>=1.14",
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smaug"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/smaug",
    "/alembic",
    "/tests",
    "/docs",
    # Contract fixtures used by the Python formula and API parity tests.
    "/frontend/src/lib/indicator-docs.ts",
    "/frontend/src/lib/types.ts",
    "/frontend/LICENSE",
    "/alembic.ini",
    "/pyproject.toml",
    "/uv.lock",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
# Typer relies on function calls (typer.Option(...)) in argument defaults.
"src/smaug/entrypoints/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
