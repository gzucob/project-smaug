name: Publish validated release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smaug-installer-release
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      pages: read
      pull-requests: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      version: ${{ steps.select.outputs.version }}
      previous: ${{ steps.stage.outputs.previous }}
      site_url: ${{ steps.stage.outputs.site_url }}
      published: ${{ steps.stage.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match the merge to its approved candidate
        id: select
        run: bash scripts/quality/select_promotion.sh
      - uses: actions/setup-node@v4
        if: steps.select.outputs.mode == 'release'
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
        if: steps.select.outputs.mode == 'release'
        id: pages
      - name: Verify and stage approved assets
        if: steps.select.outputs.mode == 'release'
        id: stage
        env:
          VERSION: ${{ steps.select.outputs.version }}
          CANDIDATE_RUN: ${{ steps.select.outputs.run }}
          CANDIDATE: ${{ steps.select.outputs.candidate }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bash scripts/quality/stage_release.sh
      - uses: actions/upload-pages-artifact@v3
        if: steps.stage.outputs.published == 'false'
        with:
          name: smaug-pages-current
          path: ${{ runner.temp }}/smaug-pages-current
      - uses: actions/upload-pages-artifact@v3
        if: steps.stage.outputs.published == 'false'
        with:
          name: smaug-pages-previous
          path: ${{ runner.temp }}/smaug-pages-previous

  activate:
    needs: stage
    if: needs.stage.outputs.mode == 'release' && needs.stage.outputs.published == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.stage.outputs.version }}
    steps:
      - run: gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  deploy:
    needs: [stage, activate]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
        with:
          artifact_name: smaug-pages-current

  verify:
    needs: [stage, deploy]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.stage.outputs.version }}
      SITE_URL: ${{ needs.stage.outputs.site_url }}
    steps:
      - name: Verify the public release and download page
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$VERSION"
          for delay in 0 3 6 12 24 48; do
            sleep "$delay"
            if curl -fsSL "${SITE_URL%/}/release.json" |
                jq -e --arg version "$VERSION" '.version == $version'; then exit 0; fi
          done
          exit 1

  rollback:
    needs: [stage, activate, deploy, verify]
    if: >-
      ${{ always() && needs.stage.result == 'success' &&
      needs.stage.outputs.mode == 'release' && needs.stage.outputs.published == 'false' &&
      needs.verify.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pages: write
    environment: github-pages
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIOUS: ${{ needs.stage.outputs.previous }}
      VERSION: ${{ needs.stage.outputs.version }}
      SITE_URL: ${{ needs.stage.outputs.site_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore the previous release if this candidate was activated
        run: bash scripts/quality/restore_release.sh
      - uses: actions/deploy-pages@v4
        if: ${{ always() && needs.deploy.result != 'skipped' }}
        with:
          artifact_name: smaug-pages-previous
      - name: Verify the previous public download page
        if: ${{ always() && needs.deploy.result != 'skipped' }}
        run: |
          for delay in 0 3 6 12 24 48; do
            sleep "$delay"
            if curl -fsSL "${SITE_URL%/}/release.json" |
                jq -e --arg version "$PREVIOUS" '.version == $version'; then exit 0; fi
          done
          exit 1
