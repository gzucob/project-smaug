name: Release installers

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Only trusted, successful main commits can publish. Never promote a PR build.
permissions:
  contents: read

concurrency:
  group: smaug-installer-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.release.outputs.required }}
    env:
      RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
      - name: Keep published releases immutable on workflow retries
        id: release
        run: |
          epoch=$(git show -s --format=%ct "$RELEASE_COMMIT")
          version="$(date -u -d "@$epoch" +%Y.%m.%d)-${RELEASE_COMMIT:0:12}"
          published=$(gh release view "$version" --json isDraft --jq '.isDraft == false' 2>/dev/null || true)
          if [[ "$published" == true ]]; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          image_base="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "backend=$image_base-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$image_base-frontend" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: backend
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.backend }}:sha-${{ env.RELEASE_COMMIT }}
          build-args: APPLICATION_COMMIT=${{ env.RELEASE_COMMIT }}
          cache-from: type=gha,scope=release-backend
          cache-to: type=gha,mode=max,scope=release-backend
      - uses: docker/build-push-action@v6
        id: frontend
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.frontend }}:sha-${{ env.RELEASE_COMMIT }}
          cache-from: type=gha,scope=release-frontend
          cache-to: type=gha,mode=max,scope=release-frontend
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build application and MCP release bundles
        env:
          BACKEND_IMAGE: ${{ steps.names.outputs.backend }}@${{ steps.backend.outputs.digest }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend }}@${{ steps.frontend.outputs.digest }}
        run: |
          uv sync --frozen
          epoch=$(git show -s --format=%ct "$RELEASE_COMMIT")
          version="$(date -u -d "@$epoch" +%Y.%m.%d)-${RELEASE_COMMIT:0:12}"
          uv run python scripts/installer/build_release.py --commit "$RELEASE_COMMIT" --version "$version" --backend "$BACKEND_IMAGE" --frontend "$FRONTEND_IMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            dist/installers/backend/
            dist/installers/full/
            dist/installers/mcp/
            dist/installers/*.zip
            dist/installers/*.tar.gz
            dist/installers/*.sha256
          retention-days: 7
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: dist/installers
      # Intentionally anonymous: released images must be pullable without login.
      - run: python3 scripts/installer/smoke.py --bundles dist/installers

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: dist/installers
      - name: Publish application and MCP installers together
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("dist/installers/backend/manifest.json"))["version"])')
          existing=$(gh release view "$version" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [[ "$existing" == false ]]; then
            echo "Immutable release already published: $version"
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF_NOTES
          Docker installers for backend, full Smaug and the standalone MCP connector, built from commit $RELEASE_COMMIT.

          Download the chosen package, verify its SHA-256 checksum and extract it. Run install.sh on Linux/macOS or install.ps1 on Windows. Docker is required; backend/full also require Compose v2. No data is collected automatically.

          Standalone MCP: select the mcp archive and use --api-base-url URL to select an existing API. No database or API is started by this package. Optional --client codex|claude|both registers the connector locally.

          Existing backend/full installations: run smaugctl update. Standalone MCP: run smaugctl mcp update. Read the [installation guide](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_COMMIT/README.md) for backup and recovery commands.
          EOF_NOTES
          if [[ "$existing" != true ]]; then
            gh release create "$version" --draft --target "$RELEASE_COMMIT" --title "Smaug $version" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$version" dist/installers/*.zip dist/installers/*.tar.gz dist/installers/*.sha256 --clobber
          # Workflow scheduling is not FIFO. An older completed build must not
          # replace a newer successfully published descendant as latest.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.target_commitish' 2>/dev/null || true)
          promote=true
          if [[ "$latest" =~ ^[a-f0-9]{40}$ ]] && [[ "$latest" != "$RELEASE_COMMIT" ]] && git merge-base --is-ancestor "$RELEASE_COMMIT" "$latest"; then
            promote=false
          fi
          gh release edit "$version" --draft=false --latest="$promote"
