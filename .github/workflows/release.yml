name: Release installers

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Only trusted, successful main commits can publish. Never promote a PR build.
permissions:
  contents: read

concurrency:
  group: smaug-installer-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.release.outputs.required }}
    env:
      RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
      - name: Keep published releases immutable on workflow retries
        id: release
        run: |
          epoch=$(git show -s --format=%ct "$RELEASE_COMMIT")
          version="$(date -u -d "@$epoch" +%Y.%m.%d)-${RELEASE_COMMIT:0:12}"
          published=$(gh release view "$version" --json isDraft --jq '.isDraft == false' 2>/dev/null || true)
          if [[ "$published" == true ]]; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          image_base="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "backend=$image_base-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$image_base-frontend" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: backend
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.backend }}:sha-${{ env.RELEASE_COMMIT }}
          build-args: APPLICATION_COMMIT=${{ env.RELEASE_COMMIT }}
          cache-from: type=gha,scope=release-backend
          cache-to: type=gha,mode=max,scope=release-backend
      - uses: docker/build-push-action@v6
        id: frontend
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.frontend }}:sha-${{ env.RELEASE_COMMIT }}
          cache-from: type=gha,scope=release-frontend
          cache-to: type=gha,mode=max,scope=release-frontend
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build both application editions
        env:
          BACKEND_IMAGE: ${{ steps.names.outputs.backend }}@${{ steps.backend.outputs.digest }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend }}@${{ steps.frontend.outputs.digest }}
        run: |
          uv sync --frozen
          epoch=$(git show -s --format=%ct "$RELEASE_COMMIT")
          version="$(date -u -d "@$epoch" +%Y.%m.%d)-${RELEASE_COMMIT:0:12}"
          uv run python scripts/installer/build_release.py --commit "$RELEASE_COMMIT" --version "$version" --backend "$BACKEND_IMAGE" --frontend "$FRONTEND_IMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            dist/installers/backend/
            dist/installers/full/
            dist/installers/smaug-installer*
            dist/installers/smaug-full-*
            dist/installers/smaug-backend-*
          retention-days: 7
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: dist/installers
      # Intentionally anonymous: released images must be pullable without login.
      - run: python3 scripts/installer/smoke.py --bundles dist/installers

  macos-packages:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: dist/installers
      - name: Package graphical macOS installers
        run: |
          version=$(python3 -c 'import json; print(json.load(open("dist/installers/backend/manifest.json"))["version"])')
          python3 scripts/installer/package_desktop.py --input dist/installers --version "$version" --system macos
          python3 scripts/installer/verify_desktop.py --input dist/installers --system macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            dist/installers/*.dmg
            dist/installers/*.dmg.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, macos-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: dist/installers
      - uses: actions/download-artifact@v4
        with:
          name: macos-installers
          path: dist/installers
      - name: Publish both application editions together
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("dist/installers/backend/manifest.json"))["version"])')
          existing=$(gh release view "$version" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [[ "$existing" == false ]]; then
            echo "Immutable release already published: $version"
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF_NOTES
          Native Smaug installers for Windows, Linux and macOS, built from commit $RELEASE_COMMIT.

          Open the graphical installer for your system: .exe on Windows, .dmg on macOS, or .deb on Ubuntu/Debian. Choose Full or Backend in the browser interface and click Install. Docker Desktop must be installed and running. The installer downloads all supported CVM/B3 data and prepares the local databases automatically.

          Use the installed Smaug shortcut to start, stop, update, or connect MCP without terminal commands. CLI commands remain available for automation.

          ZIP/tar archives are internal payloads downloaded by the native installer. Manual extraction is unnecessary.
          EOF_NOTES
          if [[ "$existing" != true ]]; then
            gh release create "$version" --draft --target "$RELEASE_COMMIT" --title "Smaug $version" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          mapfile -d '' assets < <(find dist/installers -maxdepth 1 -type f \( -name 'smaug-full-*' -o -name 'smaug-backend-*' -o -name 'smaug-installer*' \) -print0)
          gh release upload "$version" "${assets[@]}" --clobber
          # Workflow scheduling is not FIFO. An older completed build must not
          # replace a newer successfully published descendant as latest.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.target_commitish' 2>/dev/null || true)
          promote=true
          if [[ "$latest" =~ ^[a-f0-9]{40}$ ]] && [[ "$latest" != "$RELEASE_COMMIT" ]] && git merge-base --is-ancestor "$RELEASE_COMMIT" "$latest"; then
            promote=false
          fi
          gh release edit "$version" --draft=false --latest="$promote"
