name: CI

on:
  pull_request:
    branches: [develop]
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      installer: ${{ steps.detect.outputs.installer }}
      website: ${{ steps.detect.outputs.website }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect affected regressions
        id: detect
        env:
          FULL: ${{ inputs.full }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          paths="$RUNNER_TEMP/changed-paths"
          if [[ "$FULL" == true ]]; then
            echo .github/ > "$paths"
          else
            [[ -n "$BASE_SHA" ]]
            git diff --name-only --no-renames "$BASE_SHA" "$GITHUB_SHA" > "$paths"
          fi
          shared='^([^/]+$|\.github/|scripts/quality/)'
          backend='^(src/|tests/|alembic/|scripts/|frontend/src/lib/(types|indicator-docs)\.ts$)'
          frontend='^frontend/'
          installer='^(installer/|scripts/installer/|scripts/distribution_snapshot\.py$)'
          website='^website/'
          for area in backend frontend installer website; do
            affected=false
            if grep -Eq "${shared}|${!area}" "$paths"; then affected=true; fi
            echo "$area=$affected" >> "$GITHUB_OUTPUT"
          done
          if grep -Eq "${shared}|${backend}|${frontend}" "$paths"; then
            # Backend/frontend and packaging share the installed application.
            echo "installer=true" >> "$GITHUB_OUTPUT"
          fi

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes=

  quality:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # MongoDB rejects newer host kernels; track SERVER-136848 before moving
    # database jobs off the Ubuntu 22.04 runners' supported kernel.
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:8.0@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: smaug
          POSTGRES_PASSWORD: smaug
          POSTGRES_DB: smaug
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smaug -d smaug"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      SMAUG_TEST_MONGO_URI: mongodb://127.0.0.1:27017
      SMAUG_TEST_POSTGRES_URI: postgresql+asyncpg://smaug:smaug@127.0.0.1:5432/smaug
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync deps
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Import architecture
        run: uv run lint-imports --no-cache
      - name: Mypy
        run: uv run mypy src
      - name: Pytest
        run: uv run pytest

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  manager-source:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Windows Git rejects NTFS stream names even outside a sparse checkout.
      # Transfer only the portable manager sources from the same checked ref.
      - uses: actions/upload-artifact@v4
        with:
          name: manager-source
          path: |
            installer/
            scripts/installer/
            scripts/quality/verify_launchers.py
            LICENSE
          retention-days: 1
          if-no-files-found: error

  manager:
    needs: manager-source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manager-source
          path: .
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/app.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python ../scripts/quality/verify_launchers.py
      - name: Validate PowerShell launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Validate Bash launcher syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh ../scripts/installer/ci-regression.sh

  installer:
    needs: [changes, quality, frontend]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.installer == 'true' &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      SMAUG_TEST_INSTALLED_BROWSER: ${{ matrix.runner == 'ubuntu-22.04' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - run: uv sync --frozen
      - uses: actions/setup-node@v4
        if: matrix.runner == 'ubuntu-22.04'
        with:
          node-version: '24'
      - name: Install the browser for the Next.js regression
        if: matrix.runner == 'ubuntu-22.04'
        working-directory: frontend
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/smaug-browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          npm ci
          npx --no-install playwright install --with-deps --only-shell chromium
      - run: bash scripts/installer/ci-regression.sh
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'ubuntu-22.04'
        with:
          name: native-installer-packages
          path: dist/installers/smaug-*installer*
          retention-days: 3
          if-no-files-found: error

  desktop-packages:
    needs: [installer, manager-source]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manager-source
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: native-installer-packages
          path: dist/installers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package and verify macOS disk images
        if: runner.os == 'macOS'
        run: |
          python3 scripts/installer/package_desktop.py --input dist/installers --version 0.0.0-ci --system macos
          python3 scripts/installer/verify_desktop.py --input dist/installers --system macos
      - name: Verify Windows executables
        if: runner.os == 'Windows'
        run: python scripts/installer/verify_desktop.py --input dist/installers --system windows
      - uses: actions/setup-go@v5
        if: runner.os == 'Windows'
        with:
          go-version: '1.27.2'
          cache: false
      - name: Exercise Windows desktop launchers
        if: runner.os == 'Windows'
        run: ./scripts/installer/verify_windows_gui.ps1 -InputDirectory dist/installers
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: macos-installer-preview
          path: |
            dist/installers/*.dmg
            dist/installers/*.dmg.sha256
          retention-days: 3
          if-no-files-found: error

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  regressions:
    name: Regressions
    needs: [changes, workflows, quality, frontend, manager-source, manager, installer, desktop-packages, website]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ toJSON(needs.*.result) }}
    steps:
      - name: Require successful affected jobs
        run: |
          jq -e 'all(.[]; . == "success" or . == "skipped")' <<< "$RESULTS"
